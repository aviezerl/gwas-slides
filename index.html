<script>
(async () => {
  const KEY = 'gwas-slides-password', ITER = 600000;
  const form = document.querySelector('form'), input = form.querySelector('input'), msg = form.querySelector('p');
  const bytes = Uint8Array.from(atob(document.getElementById('sealed').textContent.trim()), (c) => c.charCodeAt(0));
  async function show(password) {
    const pw = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    const bits = new Uint8Array(await crypto.subtle.deriveBits(
      { name: 'PBKDF2', hash: 'SHA-256', salt: bytes.slice(8, 16), iterations: ITER }, pw, 384));
    const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-CBC', iv: bits.slice(32) }, key, bytes.slice(16)));
    if (!html.startsWith('<!doctype html>')) throw new Error('wrong password');
    try { localStorage.setItem(KEY, password); } catch {}
    document.open(); document.write(html); document.close();
  }
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch {}
  if (saved) { try { return await show(saved); } catch {} }
  form.hidden = false;
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = '';
    try { await show(input.value); } catch { msg.textContent = 'Wrong password'; }
  });
})();
</script>
